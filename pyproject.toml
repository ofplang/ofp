[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ofplang"
description = "The Object-Flow Programming Language"
requires-python = ">=3.10"
dynamic = ["version"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kazunari Kaizu", email = "kwaizu@gmail.com" }]
keywords = ["ofplang", "dataflow", "workflow", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Typing :: Typed",
]
# This distribution is a thin dispatcher: it bundles the toolchain by depending
# on the sibling packages and forwards each subcommand to their CLIs in-process.
# Siblings are resolved from PyPI. Because `ofp` exists to install *the toolchain*
# as one unit, each floor names the oldest sibling whose **behaviour** the
# umbrella still stands behind, not the oldest that would technically import: a
# resolver free to pick `ofplang-run` 0.1.0 would give `ofp run` a CLI with no
# `--document` and no `$import` expansion, which is not the toolchain this
# package is meant to name.
#
# So a floor moves when a sibling ships something `ofp` depends on -- not on
# every sibling release. `ofplang-validate` stays at 0.1.3, the release that
# added the `$import` expansion API the forwarded front doors use; 0.1.4 only
# rejects more documents and adds no interface, so requiring it would exclude a
# working combination for nothing.
#
# `ofplang-schedule>=0.9` and `ofplang-run>=0.8` move together and have to: the runner
# carries the plan itself from one replan to the next now, and the scheduler is what
# makes that possible. Paired with an older scheduler every replan of a `--jobs` run is
# refused, and a refused replan stops every job in it -- so this is a combination the
# umbrella must not let a resolver assemble.
#
# All three now move to the releases that plan and run `map` / `fold` (schedule 0.13
# expands them, run 0.13 executes the expansion, and both validate against
# specification revision 0.4, validate 0.3). Those are what `ofp` stands behind from this
# release, and the three only work as a set: run 0.13 needs schedule 0.13, which needs
# validate 0.3.
#
# They move again together, to validate 0.4, schedule 0.13.1 and run 0.13.1, which
# implement specification revision 0.5: a composite returns every output it declares,
# and the `scheduling` section is gone. The front door `ofp validate` and the reader
# behind `ofp schedule` / `ofp run` have to agree on what is valid, and under validate
# 0.3 they do not -- an unreturned output passes validation that the scheduler's reader
# now refuses.
#
# And again, to validate 0.4.1, schedule 0.14.1 and run 0.14.1: a `map` / `fold` over a
# list of values is planned and run (the run states each list's length as the
# document's `expansion`), and the front door and the reader agree once more on a
# structured node's `outputs` -- an entry with no mode, and a reference to an output the
# node does not expose, are refused by both, where validate 0.4.0 passed them.
#
# And schedule and run again, to 0.15: a `branch` whose arm the boundary decides is
# planned and run (the run states each arm as the document's `expansion.arms`), and
# run 0.15 needs schedule 0.15.
dependencies = [
# Upper bounds are deliberate. A sibling's minor version is where a
# specification revision lands, and a revision may reject documents an earlier one
# accepted: the 0.1 revision removed transform kinds and an output mode and renamed
# a process marker. Without a cap, an already-published release of this package
# would pick up the next such sibling and start refusing its own examples. The
# bounds cannot protect what is already on PyPI without one, which is why they go
# in now rather than at the first breakage.
    "ofplang-validate>=0.4.1,<0.5",
    "ofplang-schedule>=0.15,<0.16",
    "ofplang-run>=0.15,<0.16",
]

[project.urls]
Homepage = "https://github.com/ofplang/ofp"
Repository = "https://github.com/ofplang/ofp"

[project.optional-dependencies]
# `ofp export` is optional: writing documents out for people to read is not
# needed to validate, schedule or run them. `pip install "ofplang[export]"`.
export = ["ofplang-export>=0.1,<0.2"]
test = ["pytest>=7.0"]
dev = ["pytest>=7.0", "ruff>=0.16", "mypy>=1.11"]

[project.scripts]
# The umbrella command. Subcommands (`ofp validate|schedule|run|export`) forward to the
# sibling packages' own CLIs; those also ship standalone `ofp-*` commands.
ofp = "ofplang.ofp.cli:main"

# Version is derived from git tags (e.g. `v0.1.0`) by setuptools-scm; there is no
# static version in this file.
[tool.setuptools_scm]

# `ofplang` is a PEP 420 namespace shared across the org's repos (validate,
# schedule, run, …); this distribution provides only the `ofplang.ofp` package
# (the dispatcher) under it.
[tool.setuptools.packages.find]
include = ["ofplang*"]
namespaces = true

# Ship the PEP 561 marker so downstreams see this package as typed.
[tool.setuptools.package-data]
"ofplang.ofp" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "W"]

[tool.mypy]
python_version = "3.10"
files = ["ofplang"]
# `ofplang` is a PEP 420 namespace package (no __init__.py), so tell mypy how to
# root it rather than letting it guess module names.
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
